<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MY DOLL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
  color: #705d7b;
  background:
    radial-gradient(circle at 15% 15%, #fff 0 2px, transparent 3px),
    linear-gradient(145deg, #fff1f8, #f0f7ff 55%, #f6efff);
  min-height: 100vh;
}

/* ===== 標題 ===== */

header {
  text-align: center;
  padding: 22px 12px 12px;
}

.logo {
  display: inline-block;
  padding: 10px 24px;
  border-radius: 30px;

  background: linear-gradient(135deg, #ff83bd, #b891ff);

  color: white;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;

  box-shadow: 0 7px 20px rgba(205, 140, 190, .35);
}

.subtitle {
  margin-top: 8px;
  font-size: 12px;
  letter-spacing: 1px;
  color: #a68eae;
}


/* ===== 人物舞台 ===== */

.stage {
  position: relative;

  height: 540px;
  margin: 8px 14px 18px;

  overflow: hidden;

  border: 3px solid rgba(255,255,255,.95);
  border-radius: 28px;

  background:
    radial-gradient(circle at 20% 20%, #ffffff 0 3px, transparent 4px),
    radial-gradient(circle at 80% 30%, #ffffff 0 2px, transparent 3px),
    linear-gradient(180deg, #eaf8ff 0%, #fff2f8 100%);

  box-shadow: 0 12px 32px rgba(140,100,150,.18);
}

/* 背景裝飾 */

.sparkles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  color: rgba(255,255,255,.9);
  text-shadow: 0 2px 10px rgba(190,150,220,.25);
}

.s1 {
  top: 7%;
  left: 8%;
  font-size: 30px;
}

.s2 {
  top: 17%;
  right: 9%;
  font-size: 24px;
}

.s3 {
  top: 47%;
  left: 6%;
  font-size: 22px;
}

.s4 {
  top: 60%;
  right: 7%;
  font-size: 32px;
}

.s5 {
  top: 78%;
  left: 13%;
  font-size: 25px;
}


/* ===== 新人物圖片 ===== */

.doll-area {
  position: absolute;
  inset: 8px 8px 0;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  z-index: 2;
}

#dollImage {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center bottom;

  -webkit-user-select: none;
  user-select: none;

  pointer-events: none;
}


/* ===== 測試標籤 ===== */

.test-badge {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);

  z-index: 3;

  padding: 7px 13px;
  border-radius: 20px;

  background: rgba(255,255,255,.82);
  backdrop-filter: blur(6px);

  color: #d16fa2;
  font-size: 12px;
  font-weight: 800;

  box-shadow: 0 4px 15px rgba(160,110,150,.12);
}


/* ===== 下方 UI ===== */

.panel {
  padding: 20px 15px 40px;

  background: rgba(255,255,255,.93);

  border-radius: 28px 28px 0 0;

  box-shadow: 0 -6px 25px rgba(120,80,130,.10);
}

.panel h2 {
  margin: 0 0 5px;

  color: #755f80;
  font-size: 22px;
}

.note {
  margin-bottom: 18px;

  color: #ae99b1;
  font-size: 12px;
  line-height: 1.6;
}

.group {
  padding: 15px 0;
  border-top: 1px dashed #eadbea;
}

.group:first-of-type {
  border-top: none;
}

.group-title {
  margin-bottom: 10px;

  font-weight: 800;
}

.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}


/* ===== 按鈕 ===== */

button {
  padding: 10px 12px;

  border: 2px solid #eadff1;
  border-radius: 14px;

  background: white;

  color: #715f78;

  font-size: 14px;
  font-weight: 700;

  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.97);
}

button.active {
  border-color: #ff83bd;

  background: #fff0f7;

  color: #e95d9f;

  box-shadow: 0 0 0 2px #ffd9e9;
}


/* ===== 色票 ===== */

.color {
  width: 39px;
  height: 39px;

  padding: 0;

  border-radius: 50%;
}


/* ===== 底部按鈕 ===== */

.bottom {
  display: flex;
  gap: 10px;

  margin-top: 20px;
}

.bottom button {
  flex: 1;
  padding: 14px;
}

.reset {
  background: #eee7ff;
}

.save {
  border: none;

  background: linear-gradient(135deg, #ff83bd, #bd91ff);

  color: white;
}


/* ===== 提示 ===== */

.message {
  display: none;

  margin: 12px 0 0;
  padding: 11px 13px;

  border-radius: 14px;

  background: #fff3f8;

  color: #b66c91;

  font-size: 12px;
  line-height: 1.5;
}


/* ===== 小尺寸手機 ===== */

@media (max-width: 390px) {

  .stage {
    height: 500px;
  }

  .logo {
    font-size: 22px;
  }

}

</style>
</head>


<body>


<header>

  <div class="logo">
    ♡ MY DOLL
  </div>

  <div class="subtitle">
    CREATE YOUR OWN IDOL ✦
  </div>

</header>


<!-- ===== 人物區 ===== -->

<div class="stage">

  <div class="sparkles">
    <span class="star s1">☆</span>
    <span class="star s2">♡</span>
    <span class="star s3">✦</span>
    <span class="star s4">☆</span>
    <span class="star s5">♡</span>
  </div>

  <div class="test-badge">
    MY DOLL ♡ BASE TEST
  </div>

  <div class="doll-area">

    <img
      id="dollImage"
      src="my-doll-base-v1.jpg?v=2"
      alt="MY DOLL 基礎少女"
    >

  </div>

</div>



<!-- ===== 捏角 UI ===== -->

<div class="panel">

  <h2>
    捏出你的專屬偶像 ✦
  </h2>

  <div class="note">
    MY DOLL v1・新立繪載入測試版 ♡<br>
    目前先確認人物大小、位置與手機顯示效果。
  </div>


  <!-- 膚色 -->

  <div class="group">

    <div class="group-title">
      膚色
    </div>

    <div class="options">

      <button class="demo-option active">
        👐🏻
      </button>

      <button class="demo-option">
        👐🏼
      </button>

      <button class="demo-option">
        👐🏽
      </button>

    </div>

  </div>


  <!-- 眼型 -->

  <div class="group">

    <div class="group-title">
      眼睛樣式
    </div>

    <div class="options">

      <button class="demo-option active">
        一般大眼
      </button>

      <button class="demo-option">
        魅惑貓眼
      </button>

      <button class="demo-option">
        下垂狗狗眼
      </button>

    </div>

  </div>


  <!-- 眼睛顏色 -->

  <div class="group">

    <div class="group-title">
      眼睛顏色
    </div>

    <div class="options color-list"></div>

  </div>


  <!-- 眉毛 -->

  <div class="group">

    <div class="group-title">
      眉毛顏色
    </div>

    <div class="options color-list"></div>

  </div>


  <!-- 瀏海 -->

  <div class="group">

    <div class="group-title">
      瀏海
    </div>

    <div class="options">

      <button class="demo-option active">
        平瀏海
      </button>

      <button class="demo-option">
        中分瀏海
      </button>

      <button class="demo-option">
        單邊斜瀏海
      </button>

    </div>

  </div>


  <!-- 後髮 -->

  <div class="group">

    <div class="group-title">
      後髮
    </div>

    <div class="options">

      <button class="demo-option active">長直髮</button>

      <button class="demo-option">長捲髮</button>

      <button class="demo-option">短直髮</button>

      <button class="demo-option">短捲髮</button>

      <button class="demo-option">長雙馬尾</button>

      <button class="demo-option">短雙馬尾</button>

      <button class="demo-option">長單馬尾</button>

      <button class="demo-option">短單馬尾</button>

      <button class="demo-option">單顆丸子頭</button>

      <button class="demo-option">雙顆丸子頭</button>

    </div>

  </div>


  <!-- 髮色 -->

  <div class="group">

    <div class="group-title">
      髮色
    </div>

    <div class="options color-list"></div>

  </div>


  <div id="message" class="message">
    ♡ 現在是「新立繪載入測試版」，所以這些選項暫時只測試按鈕操作。
    等人物顯示確認完成後，我們再把眼睛、瀏海、後髮拆成真正可以替換的透明圖層。
  </div>


  <div class="bottom">

    <button class="reset" id="reset">
      ↻ 重設
    </button>

    <button class="save" id="save">
      ♡ 確認測試
    </button>

  </div>

</div>



<script>

/* ===== 12 色 ===== */

const colors = [

  "#F29ABD",
  "#C95762",
  "#DF9458",
  "#D8B956",

  "#6DA36E",
  "#79BCCC",
  "#6487BD",
  "#8D71B2",

  "#3C3840",
  "#9C9AA0",
  "#EEE9E3",
  "#80614F"

];


/* 建立三組色票 */

document
  .querySelectorAll(".color-list")
  .forEach((box) => {

    colors.forEach((color, index) => {

      const button =
        document.createElement("button");

      button.className = "color";

      button.style.background = color;

      if (index === 7) {
        button.classList.add("active");
      }

      button.addEventListener(
        "click",
        function () {

          box
            .querySelectorAll(".color")
            .forEach((item) => {
              item.classList.remove("active");
            });

          button.classList.add("active");

          showMessage();

        }
      );

      box.appendChild(button);

    });

  });


/* ===== 一般選項按鈕 ===== */

document
  .querySelectorAll(".group")
  .forEach((group) => {

    const buttons =
      group.querySelectorAll(".demo-option");

    buttons.forEach((button) => {

      button.addEventListener(
        "click",
        function () {

          buttons.forEach((item) => {
            item.classList.remove("active");
          });

          button.classList.add("active");

          showMessage();

        }
      );

    });

  });


/* ===== 測試提示 ===== */

function showMessage() {

  const message =
    document.getElementById("message");

  message.style.display = "block";

}


/* ===== 重設 ===== */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function () {

      location.reload();

    }
  );


/* ===== 確認測試 ===== */

document
  .getElementById("save")
  .addEventListener(
    "click",
    function () {

      const button =
        document.getElementById("save");

      button.textContent =
        "✓ 新立繪運行正常 ♡";

      showMessage();

      setTimeout(() => {

        button.textContent =
          "♡ 確認測試";

      }, 1800);

    }
  );


/* ===== 圖片載入檢查 ===== */

const dollImage =
  document.getElementById("dollImage");

dollImage.addEventListener(
  "error",
  function () {

    document
      .querySelector(".test-badge")
      .textContent =
      "⚠ 人物圖片讀取失敗";

  }
);

</script>


</body>
</html>
